user nginx;
worker_processes auto;

error_log /dev/stderr crit;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format api_json escape=json '{'
        '"ts":"$time_iso8601",'
        '"service":"nginx",'
        '"environment":"prod",'
        '"event":"proxy.request.completed",'
        '"proxy_request_id":"$request_id",'
        '"trace_id":"$upstream_http_x_request_id",'
        '"method":"$request_method",'
        '"status_code":$status,'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_status":"$upstream_status"'
        '}';

    access_log /dev/stdout api_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=voice_per_ip:10m rate=1r/s;

    upstream curitalk_api {
        server api:8010;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
