<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">

<title>Convia - Topic Prep Ready</title>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff; /* Clean white background */
            color: #000000;
        }
        .font-mono-label {
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .text-display-xl {
            font-size: 80px;
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.04em;
        }
        .text-headline-md {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }
        .text-body-lg {
            font-size: 20px;
            font-weight: 400;
            line-height: 1.5;
        }
        @media (max-width: 768px) {
            .text-display-xl {
                font-size: 48px;
                line-height: 1.0;
                letter-spacing: -0.03em;
            }

<body class="min-h-screen flex flex-col antialiased selection:bg-brand-lime selection:text-black">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto docked full-width top-0 bg-surface dark:bg-surface-container border-b border-primary dark:border-outline">
<div class="flex items-center gap-4">
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-150 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-md font-black tracking-tighter text-primary dark:text-on-surface">CONVIA</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-7xl mx-auto px-6 py-12 md:py-24 space-y-24">
<!-- Header Section -->
<section class="space-y-6">
<h2 class="text-display-xl">Osaka food trip</h2>
<!-- Summary Block (Mint) -->
<div class="bg-brand-mint rounded-lg p-8 md:p-12 w-full max-w-4xl border-2 border-transparent">
<p class="text-headline-md">Dotonbori is known for its vibrant street food scene,g basic menus.</p>
</div>
</section>
<!-- Interaction / Preparation Section -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-16">
<!-- Column 1: Direction -->
<div class="space-y-8">
<h3 class="font-mono-label text-sm font-semibold text-secondary">Choose a direction</h3>
<div class="flex flex-wrap gap-4">
<!-- Outline Pills -->
<button class="px-6 py-3 rounded-full border-2 border-primary text-primary font-mono-label text-sm hover:bg-brand-lime transition-colors">
                        Travel guide
                    </button>
<button class="px-6 py-3 rounded-full border-2 border-primary text-primary font-mono-label text-sm hover:bg-brand-lime transition-colors">
                        Restaurant blog
                    </button>
<button class="px-6 py-3 rounded-full border-2 border-primary text-primary font-mono-label text-sm hover:bg-brand-lime transition-colors">
                        Casual chat
                    </button>
</div>
</div>
<!-- Column 2: First Question -->
<div class="space-y-8">
<h3 class="font-mono-label text-sm font-semibold text-secondary">Pick a first question</h3>
<div class="space-y-4">
<!-- Selected Black Pill -->
<button class="w-full text-left px-8 py-4 rounded-full bg-primary text-white font-body text-lg hover:bg-opacity-90 transition-opacity flex justify-between items-center group">
<span class="">Can you recommend a good takoyaki stand?</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
</button>
<!-- Unselected Outline Pills -->
<button class="w-full text-left px-8 py-4 rounded-full border-2 border-primary text-primary font-body text-lg hover:bg-surface-container transition-colors">
                        How do I ask for the check?
                    </button>
<button class="w-full text-left px-8 py-4 rounded-full border-2 border-primary text-primary font-body text-lg hover:bg-surface-container transition-colors">
                        What's the best time to visit Dotonbori?
                    </button>
</div>
</div>
</section>
<!-- Action Section -->
<section class="flex justify-end pt-12 border-t border-primary">
<button class="flex items-center gap-4 bg-primary text-white px-10 py-5 rounded-full font-mono-label text-base hover:bg-brand-lime hover:text-primary transition-colors group">
                START ANSWERING
                <span class="material-symbols-outlined transform group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</section>
</main>
<!-- BottomNavBar (Hidden on desktop as per rules, visible on mobile) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface dark:bg-surface-container-lowest border-t-2 border-primary dark:border-outline">
<button class="flex flex-col items-center justify-center text-secondary dark:text-on-secondary-container px-6 py-1 hover:text-primary dark:hover:text-on-surface transition-all">
<span class="material-symbols-outlined mb-1">school</span>
<span class="text-[12px] font-label-mono font-semibold uppercase tracking-widest">Learn</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-6 py-1 transform scale-90 duration-200">
<span class="material-symbols-outlined mb-1">auto_stories</span>
<span class="text-[12px] font-label-mono font-semibold uppercase tracking-widest">Review</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-on-secondary-container px-6 py-1 hover:text-primary dark:hover:text-on-surface transition-all">
<span class="material-symbols-outlined mb-1">mic</span>
<span class="text-[12px] font-label-mono font-semibold uppercase tracking-widest">Speak</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-on-secondary-container px-6 py-1 hover:text-primary dark:hover:text-on-surface transition-all">
<span class="material-symbols-outlined mb-1">person</span>
<span class="text-[12px] font-label-mono font-semibold uppercase tracking-widest">Profile</span>
</button>
</nav>
<!-- Mobile Padding Spacer -->
<div class="h-24 md:hidden"></div>


</body></html>
