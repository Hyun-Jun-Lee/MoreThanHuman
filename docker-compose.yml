name: curitalk

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: curitalk-api:latest
    env_file:
      - ${CURITALK_ENV_FILE:-.env}
    environment:
      ENV: prod
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8010 --proxy-headers --forwarded-allow-ips='*'"
    expose:
      - "8010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./deploy/nginx/auth:/etc/nginx/auth:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v2.11.0
    profiles:
      - certbot
    entrypoint: /bin/sh
    command: >
      -c 'certbot certonly --webroot --webroot-path=/var/www/certbot
      --email "$$CERTBOT_EMAIL" --agree-tos --no-eff-email
      -d "$$CERTBOT_DOMAIN"'
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-api.curitalk.app}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt

  certbot-renew:
    image: certbot/certbot:v2.11.0
    profiles:
      - certbot
    entrypoint: /bin/sh
    command: >
      -c 'certbot renew --webroot --webroot-path=/var/www/certbot'
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
