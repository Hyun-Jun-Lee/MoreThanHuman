name: curitalk

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: curitalk-api:latest
    env_file:
      - ${CURITALK_ENV_FILE:-.env}
    environment:
      ENV: prod
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      AUDIO_CACHE_DIR: /var/lib/curitalk/audio
    volumes:
      - type: bind
        source: ${CURITALK_AUDIO_HOST_DIR:-/var/lib/curitalk/audio}
        target: /var/lib/curitalk/audio
        bind:
          create_host_path: false
    command: >
      sh -c "alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8010 --workers 2 --proxy-headers --forwarded-allow-ips='*' --no-access-log"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    expose:
      - "8010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  snack-generator:
    image: curitalk-api:latest
    profiles: ["jobs"]
    env_file:
      - ${CURITALK_ENV_FILE:-.env}
    environment:
      ENV: prod
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
    command: ["python", "-m", "scripts.generate_language_snacks"]
    restart: "no"

  audio-cache-cleanup:
    image: curitalk-api:latest
    profiles: ["jobs"]
    env_file:
      - ${CURITALK_ENV_FILE:-.env}
    environment:
      AUDIO_CACHE_DIR: /var/lib/curitalk/audio
    volumes:
      - type: bind
        source: ${CURITALK_AUDIO_HOST_DIR:-/var/lib/curitalk/audio}
        target: /var/lib/curitalk/audio
        bind:
          create_host_path: false
    command: ["python", "-m", "scripts.cleanup_conversation_audio"]
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./deploy/nginx/auth:/etc/nginx/auth:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
